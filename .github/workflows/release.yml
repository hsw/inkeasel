name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the signing secrets
        env:
          INKEASEL_KEYSTORE_BASE64: ${{ secrets.INKEASEL_KEYSTORE_BASE64 }}
          INKEASEL_KEYSTORE_PASSWORD: ${{ secrets.INKEASEL_KEYSTORE_PASSWORD }}
          INKEASEL_KEY_ALIAS: ${{ secrets.INKEASEL_KEY_ALIAS }}
          INKEASEL_KEY_PASSWORD: ${{ secrets.INKEASEL_KEY_PASSWORD }}
        run: |
          missing=""
          for name in INKEASEL_KEYSTORE_BASE64 INKEASEL_KEYSTORE_PASSWORD INKEASEL_KEY_ALIAS INKEASEL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. A release is signed with the release key only; add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # a release build never writes the shared Gradle cache
          cache-read-only: true

      - name: Decode the keystore
        env:
          INKEASEL_KEYSTORE_BASE64: ${{ secrets.INKEASEL_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$INKEASEL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Unit tests and signed release build
        env:
          INKEASEL_KEYSTORE: ${{ runner.temp }}/release.jks
          INKEASEL_KEYSTORE_PASSWORD: ${{ secrets.INKEASEL_KEYSTORE_PASSWORD }}
          INKEASEL_KEY_ALIAS: ${{ secrets.INKEASEL_KEY_ALIAS }}
          INKEASEL_KEY_PASSWORD: ${{ secrets.INKEASEL_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="$RUNNER_TEMP/inkeasel-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --verify-tag --title "InkEasel $TAG" --generate-notes
