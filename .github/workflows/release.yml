name: Release

on:
  push:
    tags: ["v*"]

# the build job runs Gradle (third-party plugins and dependencies) with a read-only token; only the job that
# publishes the release, which runs no build code, may write
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the signing secrets
        env:
          INKEASEL_KEYSTORE_BASE64: ${{ secrets.INKEASEL_KEYSTORE_BASE64 }}
          INKEASEL_KEYSTORE_PASSWORD: ${{ secrets.INKEASEL_KEYSTORE_PASSWORD }}
          INKEASEL_KEY_ALIAS: ${{ secrets.INKEASEL_KEY_ALIAS }}
          INKEASEL_KEY_PASSWORD: ${{ secrets.INKEASEL_KEY_PASSWORD }}
        run: |
          missing=""
          for name in INKEASEL_KEYSTORE_BASE64 INKEASEL_KEYSTORE_PASSWORD INKEASEL_KEY_ALIAS INKEASEL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. A release is signed with the release key only; add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # a release build never writes the shared Gradle cache
          cache-read-only: true

      - name: Decode the keystore
        env:
          INKEASEL_KEYSTORE_BASE64: ${{ secrets.INKEASEL_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$INKEASEL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Unit tests and signed release build
        env:
          INKEASEL_KEYSTORE: ${{ runner.temp }}/release.jks
          INKEASEL_KEYSTORE_PASSWORD: ${{ secrets.INKEASEL_KEYSTORE_PASSWORD }}
          INKEASEL_KEY_ALIAS: ${{ secrets.INKEASEL_KEY_ALIAS }}
          INKEASEL_KEY_PASSWORD: ${{ secrets.INKEASEL_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the APK for the release job
        uses: actions/upload-artifact@v4
        with:
          name: inkeasel-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inkeasel-release-apk
          path: ${{ runner.temp }}/apk

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="$RUNNER_TEMP/inkeasel-$TAG.apk"
          mv "$RUNNER_TEMP/apk/app-release.apk" "$apk"
          # the same APK under a fixed name: releases/latest/download/inkeasel.apk is the one address the
          # README and the Downloader code point at, whatever the version
          fixed="$RUNNER_TEMP/inkeasel.apk"
          cp "$apk" "$fixed"
          # an APK release is always "latest": releases/latest is the app download, while the catalog files
          # live in the separate `catalog` release (never touched here, a v* tag only)
          gh release create "$TAG" "$apk" "$fixed" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "InkEasel $TAG" --generate-notes
